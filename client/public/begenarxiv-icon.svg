  <line x1="130" y1="56" x2="130" y2="452" stroke="#000000" stroke-width="1.2" opacity="0.45" />
  <!-- String 4: Playable 2 (C) -->
  <line x1="143" y1="56" x2="143" y2="452" stroke="#000000" stroke-width="2.5" />
  <!-- String 5: Drone (skipped) -->
  <line x1="156" y1="56" x2="156" y2="452" stroke="#000000" stroke-width="1.2" opacity="0.45" />
