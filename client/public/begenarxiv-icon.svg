  <!-- String 9: Drone (skipped) -->
  <line x1="208" y1="56" x2="208" y2="452" stroke="#000000" stroke-width="1.2" opacity="0.45" />
  <!-- String 10: Playable 5 (G / F#) -->
  <line x1="221" y1="56" x2="221" y2="452" stroke="#000000" stroke-width="2.5" />
