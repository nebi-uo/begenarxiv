  <polygon points="62,78 80,78 106,346 88,346" fill="#000000" />
  <polygon points="238,78 256,78 230,346 212,346" fill="#000000" />

  <!-- Soundbox (Resonator Box with transparent parchment center so strings stay crisp) -->
