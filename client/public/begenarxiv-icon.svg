  <line x1="104" y1="56" x2="104" y2="452" stroke="#000000" stroke-width="2.5" />
  <!-- String 2: Drone (skipped) -->
  <line x1="117" y1="56" x2="117" y2="452" stroke="#000000" stroke-width="1.2" opacity="0.45" />
